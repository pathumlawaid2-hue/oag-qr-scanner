<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f314d">
<title>OAG QR Scanner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1722;color:#fff;font-family:Sarabun,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}body{min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:11px;margin-bottom:11px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#f59a3f,#d85f0b);font-size:24px;box-shadow:0 8px 20px #0004}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#f6c99f;margin-top:3px}.ver{font-size:10px;color:#94a3b8;margin-top:2px}.reader{position:relative;flex:1;min-height:54vh;border-radius:24px;overflow:hidden;background:#030712;border:1px solid #374151;box-shadow:0 18px 40px #0005}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#030712}.scanbox{position:absolute;left:10%;right:10%;top:22%;bottom:22%;border:3px solid #f59a3f;border-radius:20px;box-shadow:0 0 0 9999px #0005;pointer-events:none}.scanline{position:absolute;left:14%;right:14%;top:50%;height:2px;background:#fff9;box-shadow:0 0 12px #fff}.status{margin-top:11px;padding:12px 14px;border-radius:16px;background:#1f2937;border:1px solid #374151;font-weight:800;font-size:14px;line-height:1.45}.status.good{background:#0d3a31;border-color:#176b5b;color:#cff9ed}.status.warn{background:#4a3210;border-color:#8a611b;color:#ffe6b4}.status.bad{background:#4b1f23;border-color:#8b353c;color:#ffd7db}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.pill{font-size:11px;padding:7px 9px;border-radius:999px;background:#1f2937;border:1px solid #374151;color:#cbd5e1}.trigger{width:100%;min-height:64px;border:0;border-radius:18px;background:#e8751a;color:#fff;font-weight:950;font-size:20px;margin-top:10px;box-shadow:0 8px 20px #0003}.trigger:disabled{background:#6b7280;color:#e5e7eb;box-shadow:none}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.tools button{min-height:50px;border-radius:15px;border:1px solid #4b5563;background:#fff;color:#1f2937;font-weight:900;font-size:14px}.tools .primary{background:#e8751a;color:#fff;border-color:#e8751a}.tools .dark{background:#1f2937;color:#fff}.manual{display:flex;gap:8px;margin-top:9px}.manual input{min-width:0;flex:1;height:46px;border:0;border-radius:14px;padding:0 12px;font-size:15px}.manual button{border:0;border-radius:14px;background:#e8751a;color:#fff;font-weight:900;padding:0 15px}.foot{text-align:center;color:#9ca3af;font-size:11px;margin-top:8px;line-height:1.45}canvas{display:none}
</style>
</head>
<body>
<div class="head"><div class="mark">⚖</div><div><h1>สแกน QR / Barcode</h1><div class="sub">OAG • Camera Scanner</div><div class="ver">scanner v2.1.1 • one-shot return-state</div></div></div>
<div class="reader"><video id="video" playsinline muted autoplay></video><canvas id="canvas"></canvas><div class="scanbox"></div><div class="scanline"></div></div>
<div id="status" class="status">กำลังเตรียมกล้อง...</div>
<button id="readBtn" class="trigger" disabled>◎ อ่าน QR ตอนนี้</button>
<div class="meta"><span class="pill" id="modePill">โหมดตรวจข้อมูล</span><span class="pill">กล้องไม่รับค่าเอง • 1 ครั้ง = 1 รหัส</span></div>
<div class="tools"><button id="startBtn" class="primary">เปิดกล้อง / เปิดใหม่</button><button id="backBtn" class="dark">กลับ QR Center</button></div>
<div class="manual"><input id="manual" autocomplete="off" placeholder="หรือยิง/วางรหัสแล้วกด Enter"><button id="sendBtn">ส่ง</button></div>
<div class="foot">ไม่ใช้ window.opener / postMessage • ไม่เก็บข้อมูลสำนวน • กด “อ่าน QR ตอนนี้” ก่อนทุกครั้งเพื่อกันอ่าน QR อื่นโดยไม่ตั้งใจ</div>
<script src="./vendor/jsQR.js"></script>
<script>
(()=>{"use strict";
const VERSION="2.1.0";
const p=new URLSearchParams(location.search);
const returnRaw=p.get("return")||"";
const mode=(p.get("mode")||"INSPECT").toUpperCase();
const video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true}),statusEl=document.getElementById("status"),readBtn=document.getElementById("readBtn");
let returnUrl=null,stream=null,running=false,raf=0,lastFrame=0,done=false,detector=null,armed=false,armUntil=0,busy=false;
function status(msg,tone=""){statusEl.textContent=msg;statusEl.className="status "+tone}
function validReturn(v){try{const u=new URL(v);return u.protocol==="https:"&&u.hostname==="script.google.com"&&u.pathname.includes("/macros/s/")?u:null}catch(e){return null}}
returnUrl=validReturn(returnRaw);
document.getElementById("modePill").textContent=mode==="MOVE"?"โหมดย้ายแฟ้ม":"โหมดดูข้อมูล / คำสั่ง";
function syncButton(){readBtn.disabled=!running||busy;readBtn.textContent=busy?"กำลังส่งกลับ QR Center...":(armed?"◎ กำลังรอ QR...":"◎ อ่าน QR ตอนนี้")}
function disarm(){armed=false;armUntil=0;syncButton()}
function arm(){if(!running||busy||done)return;armed=true;armUntil=Date.now()+6000;syncButton();status("พร้อมอ่าน 1 ครั้ง • เล็ง QR ให้อยู่กลางกรอบ","warn")}
async function stop(){running=false;disarm();if(raf)cancelAnimationFrame(raf);raf=0;if(stream){for(const t of stream.getTracks())try{t.stop()}catch(e){}stream=null}video.srcObject=null;syncButton()}
function goBack(raw=""){if(done)return;done=true;busy=true;syncButton();stop();if(!returnUrl){status("ไม่พบ URL สำหรับกลับ QR Center","bad");return}const u=new URL(returnUrl.toString());u.searchParams.delete("scan");u.searchParams.set("scanMode",mode);u.searchParams.set("scannerReturn","1");if(raw)u.searchParams.set("scan",raw);location.replace(u.toString())}
function accept(raw){raw=String(raw||"").trim();if(!raw||done||busy||!armed)return;busy=true;disarm();status("อ่านรหัสแล้ว • กำลังกลับ QR Center...","good");setTimeout(()=>goBack(raw),120)}
async function detectFrame(){if(!running||done)return;raf=requestAnimationFrame(detectFrame);if(!armed)return;if(Date.now()>armUntil){disarm();status("ยังไม่ได้อ่าน • กด “อ่าน QR ตอนนี้” เมื่อต้องการสแกน","good");return}const ts=performance.now();if(ts-lastFrame<90)return;lastFrame=ts;if(video.readyState<2)return;try{if(detector){const codes=await detector.detect(video);if(codes&&codes.length){accept(codes[0].rawValue);return}}const w=video.videoWidth,h=video.videoHeight;if(!w||!h||!window.jsQR)return;const side=Math.floor(Math.min(w,h)*.72),sx=Math.max(0,Math.floor((w-side)/2)),sy=Math.max(0,Math.floor((h-side)/2));canvas.width=side;canvas.height=side;ctx.drawImage(video,sx,sy,side,side,0,0,side,side);const img=ctx.getImageData(0,0,side,side),code=jsQR(img.data,side,side,{inversionAttempts:"attemptBoth"});if(code&&code.data)accept(code.data)}catch(e){}}
async function start(){done=false;busy=false;await stop();if(!returnUrl){status("ลิงก์นี้ไม่ได้เปิดจาก QR Center กรุณากลับไปกดปุ่มเปิดกล้องจากระบบ","bad");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status("อุปกรณ์นี้ไม่รองรับกล้องผ่านเว็บ","bad");return}try{status("กำลังขอสิทธิ์กล้อง...","warn");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();if("BarcodeDetector" in window){try{detector=new BarcodeDetector({formats:["qr_code","code_128"]})}catch(e){detector=null}}running=true;syncButton();status("กล้องพร้อม • เล็ง QR แล้วกด “อ่าน QR ตอนนี้”","good");raf=requestAnimationFrame(detectFrame)}catch(e){status("เปิดกล้องไม่สำเร็จ • กรุณาอนุญาต Camera ให้เว็บไซต์นี้ แล้วกดเปิดกล้องอีกครั้ง","bad");syncButton()}}
function manual(){const el=document.getElementById("manual"),v=el.value.trim();el.value="";if(!v||done)return;armed=true;accept(v)}
readBtn.addEventListener("click",arm);document.getElementById("startBtn").addEventListener("click",start);document.getElementById("backBtn").addEventListener("click",()=>goBack(""));document.getElementById("sendBtn").addEventListener("click",manual);document.getElementById("manual").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();manual()}});window.addEventListener("pagehide",()=>stop());setTimeout(start,180);
})();
</script>
</body></html>
